{% extends "base.html" %}

{% block title %}Sign In - Community Service Desk{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.5rem; margin-bottom: 8px;">Sign In to Service Desk</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Enter your organization email and password to access support tickets.
      </p>
    </div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required autocomplete="email" autofocus placeholder="user@example.org">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <div class="form-group">
        <label for="organization_slug">Organization Slug (Optional)</label>
        <input type="text" id="organization_slug" name="organization_slug" placeholder="e.g. metro-community">
        <div class="form-hint">Leave blank to use your default primary organization.</div>
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
